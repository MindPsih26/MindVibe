<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindVibe - Public</title>
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #fefce8; 
            margin: 0; padding: 20px;
            color: #1a1a1a;
            line-height: 1.5;
        }
        .container { max-width: 500px; margin: 0 auto; text-align: center; }
        .header { font-size: 40px; font-weight: 900; text-transform: uppercase; margin-bottom: 20px; }
        .accent { color: #f59e0b; }
        .mesaj-card { 
            background: white; 
            border: 4px solid black; 
            padding: 20px; 
            border-radius: 15px;
            box-shadow: 8px 8px 0px black;
            margin-bottom: 30px;
        }
        .sun-icon { font-size: 150px; margin: 0 auto 40px; display: block; }
        
        /* Zona de admin este ascunsa pentru vizitatori, o gasesti doar tu prin scroll */
        .admin-zone {
            margin-top: 150px;
            padding: 30px 20px;
            border-top: 2px solid #ddd;
            opacity: 0.3; /* Foarte discreta pentru vizitatori */
        }
        .admin-zone:hover { opacity: 1; } /* Se vede clar cand ajungi la ea */

        input, textarea { width: 90%; padding: 15px; margin: 10px 0; border: 3px solid black; border-radius: 10px; }
        .btn { background: #fbbf24; border: 3px solid black; padding: 15px 30px; font-weight: 900; text-transform: uppercase; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">Mind<span class="accent">Vibe</span> ☀️</div>

        <div class="mesaj-card">
            <p style="font-size: 12px; font-weight: bold; text-transform: uppercase; color: #f59e0b; margin: 0;">Mesajul Zilei:</p>
            <h2 id="text-site" style="margin: 10px 0;">Ești mai mult decât un test! ✨</h2>
        </div>

        <div class="sun-icon">😊</div>
        <p style="font-weight: bold; color: #f59e0b; margin-top: -30px;">Stay Sunny!</p>

        <div class="admin-zone">
            <p style="font-size: 10px; font-weight: bold;">ADMIN SECURED</p>
            <div id="login-section">
                <input type="password" id="pass-input" placeholder="Parola">
                <br>
                <button class="btn" onclick="login()">Log In</button>
            </div>
            <div id="dash-section" class="hidden">
                <p>Ești conectat. Pentru a schimba mesajul pentru <b>TOȚI</b> vizitatorii, editează fișierul index.html în GitHub.</p>
                <button onclick="logout()" style="color: red; font-size: 10px;">Ieșire</button>
            </div>
        </div>
    </div>

    <script>
        function login() {
            if(document.getElementById('pass-input').value === 'mindvibe2024') {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dash-section').classList.remove('hidden');
            } else { alert("Acces interzis."); }
        }
        function logout() { location.reload(); }
    </script>
</body>
</html>
