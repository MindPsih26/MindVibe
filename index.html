TYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MindVibe App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #fefce8; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        .neo-brutal { border: 4px solid black; box-shadow: 8px 8px 0px black; }
        section { display: none; }
        section.active { display: block; }
    </style>
</head>
<body>

    <nav class="bg-white border-b-4 border-black p-4 flex justify-between items-center sticky top-0 z-[100]">
        <span class="font-black text-xl tracking-tighter uppercase">MindVibe</span>
        <div class="flex gap-2">
            <button onclick="showPage('home')" class="bg-blue-400 border-2 border-black p-2 shadow-[2px_2px_0px_black] text-xs font-black">HOME</button>
            <button onclick="showPage('admin')" class="bg-yellow-300 border-2 border-black p-2 shadow-[2px_2px_0px_black] text-xs font-black italic">ADMIN 🔒</button>
        </div>
    </nav>

    <section id="home" class="active p-6 animate-fadeIn">
        <div class="text-center">
            <h1 class="text-6xl font-black mb-6 uppercase leading-[0.8] mt-4">STAY <br><span class="text-indigo-600">REAL.</span></h1>
            
            <div class="neo-brutal p-6 rounded-2xl bg-white mb-10 mx-auto max-w-sm">
                <p id="display-text" class="text-xl font-bold italic">"Ești mai mult decât scorul de la test."</p>
            </div>

            <img src="https://api.dicebear.com/7.x/open-peeps/svg?face=smileBig&head=shaved2&skinColor=ffffff" 
                 class="w-56 h-56 border-4 border-black rounded-full bg-blue-100 mx-auto shadow-[10px_10px_0px_black]">
        </div>
    </section>

    <section id="admin" class="p-6">
        <div id="login-form" class="max-w-sm mx-auto">
            <h2 class="text-3xl font-black mb-6 uppercase italic">Acces Securizat</h2>
            <div class="neo-brutal p-6 rounded-2xl bg-white">
                <input type="password" id="admin-pass" class="w-full border-4 border-black p-4 rounded-xl mb-4 font-black" placeholder="PAROLA">
                <button onclick="login()" class="w-full bg-black text-white py-4 rounded-xl font-black uppercase hover:bg-gray-800 transition">Intră în Panou</button>
            </div>
        </div>

        <div id="admin-dashboard" class="hidden max-w-sm mx-auto pb-20">
            <h2 class="text-3xl font-black mb-2 uppercase text-indigo-600">DASHBOARD</h2>
            <p class="text-[10px] font-black uppercase text-green-600 mb-6 tracking-widest">● Conectat ca Moderator</p>
            
            <div class="neo-brutal p-6 rounded-2xl bg-white space-y-6">
                <div>
                    <label class="block font-black text-xs uppercase mb-2">Schimbă Mesajul Principal:</label>
                    <textarea id="input-text" class="w-full border-4 border-black p-4 rounded-xl font-bold bg-yellow-50 focus:outline-none" rows="5"></textarea>
                </div>
                
                <button onclick="updateMessage()" class="w-full bg-indigo-500 text-white py-4 rounded-xl font-black border-4 border-black shadow-[4px_4px_0px_black] uppercase">
                    Salvează pe Telefon
                </button>

                <button onclick="logout()" class="w-full text-red-600 font-black underline text-xs uppercase pt-4">Ieșire din cont</button>
            </div>
        </div>
    </section>

    <script>
        // Logica de navigare intre pagini (fara scroll blocat)
        function showPage(pageId) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0,0);
        }

        // Incarcare date salvate
        window.onload = function() {
            const savedData = localStorage.getItem('mindvibe_msg');
            if(savedData) document.getElementById('display-text').innerText = savedData;
            
            if(localStorage.getItem('is_logged') === 'true') {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
            }
        }

        function login() {
            const p = document.getElementById('admin-pass').value;
            if(p === 'mindvibe2024') {
                localStorage.setItem('is_logged', 'true');
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                document.getElementById('input-text').value = document.getElementById('display-text').innerText;
            } else {
                alert('Parola gresita!');
            }
        }

        function updateMessage() {
            const txt = document.getElementById('input-text').value;
            if(txt) {
                localStorage.setItem('mindvibe_msg', txt);
                document.getElementById('display-text').innerText = txt;
                alert('Mesaj salvat local! ✨');
                showPage('home');
            }
        }

        function logout() {
            localStorage.removeItem('is_logged');
            location.reload();
        }
    </script>
</body>
</html>
