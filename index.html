<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>MindPsih26 | Squad Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* [Stilurile raman identice pentru a pastra designul tau] */
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: white; margin: 0; }
        .section-content { display: none; }
        .section-active { display: block; }
        .share-card { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); padding: 20px; border-radius: 25px; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- 🔐 AUTH SECTION -->
    <section id="auth-section" class="section-content section-active min-h-screen flex items-center justify-center p-6">
        <div class="bg-[#1e293b] p-8 rounded-[40px] w-full max-w-md border border-white/10">
            <h2 id="auth-title" class="text-3xl font-bold text-center text-indigo-400">MindPsih26</h2>
            <div id="invite-msg" class="hidden text-green-400 text-center text-sm mt-4 italic">✨ Bun venit în Squad! Creează-ți contul:</div>
            <form id="auth-form" class="flex flex-col gap-4 mt-6">
                <input type="text" id="username" placeholder="Username" required class="w-full bg-[#334155] p-3 rounded-lg border-none text-white">
                <input type="password" id="password" placeholder="Parolă" required class="w-full bg-[#334155] p-3 rounded-lg border-none text-white">
                <div id="extra-fields" class="flex flex-col gap-4">
                    <input type="number" id="age" placeholder="Vârsta" class="w-full bg-[#334155] p-3 rounded-lg border-none">
                </div>
                <button type="submit" id="auth-submit-btn" class="bg-indigo-600 p-3 rounded-xl font-bold">Creează Profil</button>
            </form>
        </div>
    </section>

    <!-- 📱 MAIN APP -->
    <div id="main-app" style="display: none;">
        <section id="home" class="section-content section-active min-h-screen flex flex-col items-center justify-center p-6 text-center">
            <h1 class="text-5xl font-bold text-indigo-400">MindPsih26</h1>
            
            <!-- LINK DISTRIBUȚIE -->
            <div class="share-card w-full max-w-sm">
                <p class="text-xs font-bold mb-2">LINK INVITAȚIE SQUAD:</p>
                <div class="flex bg-black/30 rounded-lg p-2">
                    <input id="share-link-input" readonly class="bg-transparent w-full text-[10px]" value="https://mindpsih26.netlify.app/#join">
                    <button onclick="copyInvite()" class="bg-white text-indigo-600 px-3 py-1 rounded-md text-[10px] font-bold">COPY</button>
                </div>
            </div>
            
            <div class="mt-10 grid grid-cols-2 gap-4">
                <button onclick="logout()" class="bg-red-500/20 px-6 py-3 rounded-full">Logout</button>
            </div>
        </section>
    </div>

    <script>
        // 1. Logica de detectare link la deschidere
        window.onload = function() {
            if (window.location.hash === "#join") {
                document.getElementById('invite-msg').classList.remove('hidden');
                console.log("Utilizator nou detectat din link!");
            }
            
            // Verificare sesiune
            const s = JSON.parse(localStorage.getItem('active_session'));
            if (s) loginSuccess(s.userData);
        };

        // 2. Copiere link pentru distribuție
        function copyInvite() {
            const input = document.getElementById('share-link-input');
            input.select();
            document.execCommand("copy");
            alert("Link copiat! Trimite-l prietenilor.");
        }

        // 3. Logica de login (rămâne neschimbată)
        function loginSuccess(ud) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        }

        document.getElementById('auth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            localStorage.setItem('active_session', JSON.stringify({ userData: {user: 'test'}, loginDate: Date.now() }));
            location.reload();
        });

        function logout() { localStorage.removeItem('active_session'); location.reload(); }
    </script>
</body>
</html>
