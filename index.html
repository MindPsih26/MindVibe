<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindPsih26 | Squad Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: white; margin: 0; overflow-x: hidden; scroll-behavior: smooth; }
        .section-content { display: none; opacity: 0; transition: opacity 0.4s ease; }
        .section-active { display: block; opacity: 1; }
        .home-circle { width: 120px; height: 120px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; transition: 0.3s; font-weight: bold; border: 2px solid rgba(255,255,255,0.1); font-size: 0.75rem; line-height: 1.2; }
        .home-circle:hover { transform: scale(1.1); border-color: #6366f1; box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
        input, select { background: #1e293b !important; border: 1px solid #475569 !important; color: white !important; border-radius: 12px; padding: 12px; }
        .chat-container { height: 350px; background: #020617; border-radius: 20px; padding: 15px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.05); }
        .problem-card { background: #1e293b; padding: 20px; border-radius: 25px; border-left: 6px solid #f97316; }
        .mood-btn { transition: all 0.2s; font-size: 1.5rem; filter: grayscale(1); cursor: pointer; border:none; background:none; }
        .mood-btn.active { filter: grayscale(0); transform: scale(1.3); }
    </style>
</head>
<body>

    <!-- AUTH SECTION -->
    <section id="auth-section" class="section-content section-active min-h-screen flex items-center justify-center p-6">
        <div class="bg-slate-800 p-8 rounded-[40px] w-full max-w-md shadow-2xl border border-white/10">
            <h2 class="text-3xl font-extrabold text-center mb-2 text-indigo-400 italic">MindPsih26</h2>
            <p class="text-center text-slate-400 text-xs mb-6">Securizează-ți profilul de Squad</p>
            <form id="auth-form" class="flex flex-col gap-4">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Parolă SQUAD" required>
                <div class="flex gap-2">
                    <input type="number" id="age" placeholder="Vârstă" class="w-1/2" required>
                    <select id="gender" class="w-1/2" required>
                        <option value="">Sex</option>
                        <option value="Masculin">Masculin</option>
                        <option value="Feminin">Feminin</option>
                    </select>
                </div>
                <label class="text-[10px] text-slate-400 flex items-center gap-2 px-1 cursor-pointer">
                    <input type="checkbox" id="keep-logged" checked class="w-4 h-4"> Menține logarea 30 de zile
                </label>
                <button type="submit" class="bg-indigo-600 py-4 rounded-xl font-bold hover:bg-indigo-500 transition-all mt-2 uppercase">Intră în Squad</button>
            </form>
        </div>
    </section>

    <!-- MAIN APP -->
    <div id="main-app" style="display: none;">
        <nav class="p-4 flex justify-between items-center border-b border-white/10 bg-slate-900/50 sticky top-0 z-50 backdrop-blur-md">
            <div class="flex items-center gap-3">
                <button id="global-back" onclick="goBack()" class="bg-slate-800 p-2 rounded-lg text-xs hover:bg-slate-700">←</button>
                <span class="font-black text-lg text-indigo-400 cursor-pointer" onclick="navigateTo('home')">MindPsih26</span>
            </div>
            <button onclick="logout()" class="text-red-500 text-[10px] font-bold border border-red-500/30 px-3 py-1 rounded-full">LOGOUT</button>
        </nav>

        <!-- HOME -->
        <section id="home" class="section-content p-6">
            <div class="bg-slate-800/80 p-6 rounded-[30px] mb-8 border border-white/5 text-center">
                <div id="user-welcome" class="text-xs text-indigo-300 mb-4 font-bold"></div>
                <h3 class="text-sm font-bold mb-4 uppercase text-slate-400">Vibe-ul tău de azi?</h3>
                <div class="flex justify-around items-center max-w-sm mx-auto">
                    <button onclick="setMood('happy', this)" class="mood-btn">😊</button>
                    <button onclick="setMood('neutral', this)" class="mood-btn">😐</button>
                    <button onclick="setMood('sad', this)" class="mood-btn">😔</button>
                    <button onclick="setMood('angry', this)" class="mood-btn">😤</button>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 justify-items-center mb-10">
                <div onclick="navigateTo('chat-section')" class="home-circle bg-pink-600">💬<br>CHAT</div>
                <div onclick="navigateTo('tests-hub')" class="home-circle bg-indigo-600">🎮<br>ARENA</div>
                <div onclick="navigateTo('top-15')" class="home-circle bg-orange-600">🚩<br>TOP 15</div>
                <div onclick="navigateTo('anti-addiction')" class="home-circle bg-cyan-600">🛡️<br>HACKS</div>
                <div onclick="navigateTo('confidence')" class="home-circle bg-emerald-600">🚀<br>CONFIDENCE</div>
            </div>
        </section>

        <!-- CHAT SECTION -->
        <section id="chat-section" class="section-content p-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2">
                    <div id="chat-box" class="chat-container mb-4 space-y-3"></div>
                    <div class="flex gap-2 bg-slate-800 p-2 rounded-2xl border border-white/5">
                        <input id="chat-msg" type="text" placeholder="Mesaj..." class="flex-1 bg-transparent outline-none px-2">
                        <button onclick="sendMsg()" class="bg-indigo-600 px-6 py-2 rounded-xl font-bold text-sm">TRIMITE</button>
                    </div>
                </div>
                <div class="bg-slate-900 p-4 rounded-3xl border border-white/5 h-fit">
                    <h4 class="text-[10px] font-bold text-indigo-400 mb-4 tracking-widest uppercase">Squad Online</h4>
                    <ul id="online-users" class="space-y-4">
                        <li class="flex justify-between items-center text-xs">
                            <span>● Andrei_2k26</span>
                            <button onclick="privateInvite('Andrei_2k26')" class="bg-indigo-600/40 px-2 py-1 rounded text-[9px]">INVITĂ</button>
                        </li>
                        <li class="flex justify-between items-center text-xs">
                            <span>● Daria.Squad</span>
                            <button onclick="privateInvite('Daria.Squad')" class="bg-indigo-600/40 px-2 py-1 rounded text-[9px]">INVITĂ</button>
                        </li>
                        <li class="flex justify-between items-center text-xs">
                            <span>● Mihai_X</span>
                            <button onclick="privateInvite('Mihai_X')" class="bg-indigo-600/40 px-2 py-1 rounded text-[9px]">INVITĂ</button>
                        </li>
                    </ul>
                </div>
            </div>
        </section>

        <!-- ARENA TESTELOR -->
        <section id="tests-hub" class="section-content p-6">
            <h2 class="text-2xl font-black mb-6">Test Runner</h2>
            <div id="tests-grid" class="grid gap-4"></div>
        </section>

        <!-- TOP 15 PROBLEME -->
        <section id="top-15" class="section-content p-6">
            <h2 class="text-2xl font-black mb-6 text-orange-500 italic">Top 15 Probleme Adolescenți</h2>
            <div id="list-15" class="space-y-6"></div>
        </section>

        <!-- HACKS (ANTI-ADDICT) -->
        <section id="anti-addiction" class="section-content p-6">
            <h2 class="text-2xl font-black mb-6 text-cyan-400 italic">🛡️ Anti-Adicții Hacks</h2>
            <div id="addict-list" class="grid gap-4 md:grid-cols-2"></div>
        </section>

        <!-- CONFIDENCE -->
        <section id="confidence" class="section-content p-6">
            <h2 class="text-2xl font-black mb-6 text-emerald-500">🚀 20 Sfaturi Încredere</h2>
            <div id="conf-list" class="grid gap-3 text-[11px] md:grid-cols-2"></div>
        </section>

        <!-- TEST RUNNER UI -->
        <section id="test-runner" class="section-content p-6">
            <div class="max-w-2xl mx-auto bg-slate-900 p-8 rounded-[40px] border border-white/10 shadow-2xl">
                <h2 id="test-title" class="text-xl font-bold text-indigo-400 mb-6"></h2>
                <div id="question-container">
                    <p id="question-text" class="text-lg mb-8"></p>
                    <div class="grid gap-3" id="test-options"></div>
                </div>
                <div id="test-result" class="hidden text-center space-y-4">
                    <div id="result-score" class="text-3xl font-black"></div>
                    <p id="result-tip" class="bg-slate-800 p-4 rounded-2xl italic text-sm text-indigo-200"></p>
                    <button onclick="navigateTo('tests-hub')" class="w-full bg-indigo-600 py-4 rounded-xl font-bold">ÎNAPOI LA LISTĂ</button>
                </div>
            </div>
        </section>
    </div>

    <script>
        // --- DATABASE ---
        const PROBLEMS = [
            {p: "Acceptarea Aspectului Fizic", s: ["Focalizează-te pe ce poate face corpul tău", "Haine care te fac să te simți comod", "Fără filtre în poze o săptămână", "Sport pentru energie, nu pentru look", "Spune-ți ceva bun în oglindă", "Limitează conturile 'fitspo'", "Perfecțiunea nu există", "Îmbracă-te cum îți place ție", "Fii blând cu tine", "Aspectul e doar o parte din tine"]},
            {p: "Notele și Presiunea Școlară", s: ["Metoda Pomodoro", "Stabilește priorități zilnice", "Notele nu definesc valoarea ta", "Dormi 8 ore pentru memorie", "Cere ajutor profesorilor", "Învață logic, nu pe de rost", "Plan de învățare realist", "Nu te compara cu cei care tocesc", "Pauze de deconectare totală", "Ești la școală să înveți, nu să fii robot"]},
            {p: "Conflictul cu Părinții", s: ["Explică-le calm cum te simți", "Folosește 'Eu simt că'", "Propune un compromis ulterior", "Ascultă și varianta lor", "Cere timp pentru tine", "Arată responsabilitate în lucruri mici", "Nu reacționa impulsiv", "Caută un moment neutru pentru discuții", "Explică nevoia de autonomie", "Vor să te protejeze, chiar dacă greșesc"]},
            {p: "Dependența de Smartphone", s: ["Limite de timp pe aplicații", "Fără telefon înainte de somn", "Lasă telefonul în altă cameră când înveți", "Găsește un hobby fizic", "O zi pe săptămână 'Digital Detox'", "Dezactivează notificările inutile", "Ecran în modul alb-negru", "Fără telefon la masă", "Lasă-l în geantă cu prietenii", "Recunoaște când e doar plictiseală"]},
            {p: "Frica de Judecata Altor", s: ["Oamenii se gândesc mai mult la ei", "Fii autentic, criticile vin oricum", "Înconjoară-te de oameni pozitivi", "Exersează vorbitul în oglindă", "Nu căuta validare online", "Nu poți plăcea tuturor", "Fă ce îți place ție", "Cei care judecă au nesiguranțe", "Încrederea crește prin decizii proprii", "Nu te scuza pentru cine ești"]},
            {p: "Anxietate și Panică", s: ["Respirație 4-7-8", "Tehnica împământării 5-4-3-2-1", "Redu zahărul și cafeaua", "Vorbește cu un consilier", "Scrie în jurnal temerile", "Acceptă anxietatea ca pe o emoție", "Sportul consumă adrenalina", "Ascultă muzică calmă", "Nu evita locurile, gestionează-le", "Va trece, ai încredere"]},
            {p: "Dragostea și Despărțirile", s: ["Plânsul e normal, dă-ți timp", "Șterge pozele care te dor temporar", "Nu urmări fostul/fosta pe net", "Ieși cu prietenii", "Focalizează-te pe tine", "Nu intra în altă relație imediat", "Scrie ce simți și arde hârtia", "E o experiență de învățare", "Nu te învinovăți", "Timpul vindecă tot"]},
            {p: "Lipsa de Motivație", s: ["Fă pași mici (5 minute)", "Recompensează-te", "Ascultă muzică energică", "Fă ordine la birou", "Gândește-te la 'De ce'-ul tău", "Notează progresul", "Acceptă zilele proaste", "Începe fără să aștepți inspirația", "Obiective pe termen scurt", "Odihnește-te când ești ars"]},
            {p: "Bullying / Cyberbullying", s: ["Block și Report imediat", "Anunță un adult", "Nu intra în jocul lor", "Salvează dovezi (screenshots)", "Ești valoros, nu crede ce spun", "Nu răspunde cu violență", "Stai în grupuri sigure", "Nu lăsa jignirile să intre la inimă", "Caută sprijin la școală", "Nu e vina ta niciodată"]},
            {p: "Sentimentul de Singurătate", s: ["Ieși la evenimente locale", "Înscrie-te la un grup/curs", "Salută tu primul", "Fii tu un prieten bun întâi", "Voluntariatul deschide uși", "Acceptă invitațiile", "Nu te izola complet", "Comunități online sănătoase", "Ești o persoană valoroasă", "Răbdare cu noile prietenii"]},
            {p: "Oboseala Cronică", s: ["Rutină fixă de somn", "Fără ecrane înainte de culcare", "Bea suficientă apă", "Aerisește camera", "Verifică Vitamina D/Fierul", "Fără cofeină după-amiaza", "Stretching ușor", "Elimină zgomotele de fundal", "Ascultă-ți corpul", "Echilibrează studiul cu odihna"]},
            {p: "Frica de Viitor", s: ["Trăiește în prezent", "E ok să nu știi totul acum", "Explorează ce îți place", "Vorbește cu adulți din diverse domenii", "Planuri pe termen scurt", "Viața e imprevizibilă, e normal", "Succesul e un drum", "Învață abilități noi", "Nu te compara cu adulții", "Te vei adapta, ai încredere"]},
            {p: "Invidia față de alții", s: ["Fiecare are lupte ascunse", "Fii recunoscător pentru ce ai", "Dezinstalează aplicații frustrante", "Fiecare are ritmul lui", "Transformă invidia în ambiție", "Nu te compara cu poze editate", "Focalizează-te pe progresul tău", "Tu ești unicul tău rival", "Apreciază efortul altora", "Ai calități unice"]},
            {p: "Confuzia de Identitate", s: ["E ok să experimentezi stiluri", "Citește cărți diverse", "Nu te grăbi cu etichetele", "Fii sincer cu nevoile tale", "Explorează pasiuni noi", "Ascultă-te pe tine", "Ești în continuă schimbare", "E ok să te răzgândești", "Acceptă schimbarea de gusturi", "Află ce te face fericit"]},
            {p: "Lipsa Banilor", s: ["Învață bazele economisirii", "Mici joburi sezoniere/online", "Vinde ce nu folosești", "Apreciază experiențele, nu obiectele", "Planifică cheltuielile", "Diferențiază nevoi de dorințe", "Gătește acasă", "Evită impulsul de a cumpăra", "Fă un buget săptămânal", "Banii nu definesc fericirea"]}
        ];

        const ADDICTIONS = {
            "Telefon/Social Media": ["Regula 'Fără ecrane în pat'", "Dezactivează notificările", "Ecran mod Gri"],
            "Vaping/Fumat": ["Mestecă gumă mentolată", "Aruncă dispozitivul ACUM", "Bea apă cu paiul"],
            "Zahăr/Energizante": ["Înlocuiește cu apă minerală + lămâie", "Dormi 8 ore (scade pofta de dulce)"],
            "Procrastinare": ["Regula de 5 secunde: 5-4-3-2-1 START", "Începe cu cel mai greu task"]
        };

        const CONFIDENCE = [
            "Stai drept, umerii în spate", "Privește oamenii în ochi", "Vorbește mai rar", "Nu te mai scuza fără motiv",
            "Fă-ți patul zilnic", "Învață să spui NU ferm", "Acceptă complimentele simplu: Mulțumesc", "Fă sport 20 min"
        ];

        const TESTS = {
            stima: { title: "Stima de Sine", q: ["Te simți demn de respect?", "Ai curaj să încerci lucruri noi?", "Îți accepți greșelile?"] },
            bullying: { title: "Test Bullying", q: ["Te temi de anumite persoane la școală?", "Ești exclus din grupuri intenționat?"] }
        };

        let navigationHistory = [];
        let currentSection = 'auth-section';

        // --- CORE LOGIC ---
        window.onload = () => {
            const session = JSON.parse(localStorage.getItem('mind_session_2k26'));
            if(session && (Date.now() < session.expiry)) {
                showApp(session.user);
            }
            renderStaticData();
        };

        document.getElementById('auth-form').onsubmit = (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value; 
            const keep = document.getElementById('keep-logged').checked;
            
            const expiry = keep ? Date.now() + (30 * 24 * 60 * 60 * 1000) : Date.now() + (2 * 60 * 60 * 1000);
            localStorage.setItem('mind_session_2k26', JSON.stringify({user: u, expiry: expiry, pass: btoa(p)}));
            showApp(u);
        };

        function showApp(u) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('user-welcome').innerText = `Salut, ${u}! Ești în zona sigură.`;
            navigateTo('home');
        }

        function navigateTo(id) {
            if (currentSection !== id) navigationHistory.push(currentSection);
            currentSection = id;

            document.querySelectorAll('.section-content').forEach(s => {
                s.classList.remove('section-active');
                s.style.display = 'none';
            });

            const target = document.getElementById(id);
            target.style.display = 'block';
            setTimeout(() => target.classList.add('section-active'), 10);
            
            document.getElementById('global-back').style.visibility = (id === 'home') ? 'hidden' : 'visible';
        }

        function goBack() {
            if (navigationHistory.length > 0) {
                const prev = navigationHistory.pop();
                currentSection = prev;
                document.querySelectorAll('.section-content').forEach(s => {
                    s.classList.remove('section-active');
                    s.style.display = 'none';
                });
                const target = document.getElementById(prev);
                target.style.display = 'block';
                target.classList.add('section-active');
                document.getElementById('global-back').style.visibility = (prev === 'home') ? 'hidden' : 'visible';
            }
        }

        function renderStaticData() {
            // Probleme actualizate cu 10 SFATURI FIECARE
            document.getElementById('list-15').innerHTML = PROBLEMS.map(item => `
                <div class="problem-card">
                    <h4 class="font-bold text-orange-400 text-base mb-3">${item.p}</h4>
                    <ul class="text-[10px] text-slate-300 space-y-1 grid grid-cols-1 md:grid-cols-2 gap-x-4">
                        ${item.s.map(tip => `<li>• ${tip}</li>`).join('')}
                    </ul>
                </div>`).join('');

            // Hacks
            let hackHtml = '';
            for(let key in ADDICTIONS) {
                hackHtml += `<div class="bg-slate-800 p-4 rounded-2xl border-b-2 border-cyan-500">
                    <h4 class="text-xs font-bold text-cyan-400 mb-2">${key}</h4>
                    <ul class="text-[10px] space-y-1">${ADDICTIONS[key].map(h => `<li>⚡ ${h}</li>`).join('')}</ul>
                </div>`;
            }
            document.getElementById('addict-list').innerHTML = hackHtml;

            // Confidence
            document.getElementById('conf-list').innerHTML = CONFIDENCE.map(c => `
                <div class="bg-slate-800/50 p-3 rounded-xl border border-white/5 italic">✨ ${c}</div>`).join('');

            // Tests Grid
            document.getElementById('tests-grid').innerHTML = Object.keys(TESTS).map(k => `
                <button onclick="runTest('${k}')" class="bg-slate-800 p-6 rounded-2xl border-l-4 border-indigo-500 text-left">
                    <div class="font-bold">${TESTS[k].title}</div>
                </button>`).join('');
        }

        // --- TEST ENGINE ---
        let currentTest = null;
        let qIdx = 0;
        let score = 0;

        function runTest(key) {
            currentTest = TESTS[key];
            qIdx = 0; score = 0;
            document.getElementById('test-title').innerText = currentTest.title;
            document.getElementById('test-result').classList.add('hidden');
            document.getElementById('question-container').classList.remove('hidden');
            showQ();
            navigateTo('test-runner');
        }

        function showQ() {
            document.getElementById('question-text').innerText = currentTest.q[qIdx];
            document.getElementById('test-options').innerHTML = [1,3,5].map(v => `
                <button onclick="handleAns(${v})" class="bg-slate-800 p-4 rounded-xl hover:bg-indigo-600 transition-all">Nota ${v}</button>
            `).join('');
        }

        function handleAns(v) {
            score += v; qIdx++;
            if(qIdx < currentTest.q.length) showQ();
            else {
                document.getElementById('question-container').classList.add('hidden');
                document.getElementById('test-result').classList.remove('hidden');
                document.getElementById('result-score').innerText = score > (currentTest.q.length * 3) ? "Nivel Ridicat" : "Nivel Echilibrat";
                document.getElementById('result-tip').innerText = "Squad-ul îți recomandă să discuți cu cineva dacă simți presiune.";
            }
        }

        // --- CHAT & OTHERS ---
        function sendMsg() {
            const input = document.getElementById('chat-msg');
            if(!input.value) return;
            const chat = document.getElementById('chat-box');
            chat.innerHTML += `<div class="bg-indigo-600/20 p-3 rounded-2xl self-end ml-10 border border-indigo-500/20">
                <p class="text-[9px] text-indigo-400 font-bold mb-1">TU</p>
                <p class="text-xs">${input.value}</p>
            </div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;
        }

        function privateInvite(user) {
            alert(`Cerere trimisă către ${user}. Așteaptă acceptul pentru canalul privat securizat.`);
        }

        function setMood(m, btn) {
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function logout() {
            localStorage.removeItem('mind_session_2k26');
            location.reload();
        }
    </script>
</body>
</html>
