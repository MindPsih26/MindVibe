<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindVibe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #fefce8; margin: 0; padding: 0; }
        .neo-card { border: 4px solid #000; box-shadow: 8px 8px 0px #000; background: white; }
        .admin-section { display: none; background: #fff; border-top: 4px solid black; padding: 20px; }
    </style>
</head>
<body>

    <nav class="bg-white border-b-4 border-black p-4 flex justify-between items-center sticky top-0 z-50">
        <span class="font-black uppercase">MindVibe</span>
        <button onclick="toggleAdmin()" class="bg-yellow-300 border-2 border-black px-4 py-2 font-black text-xs shadow-[3px_3px_0px_black] active:shadow-none active:translate-x-1">MODERARE 🔒</button>
    </nav>

    <main id="main-content" class="p-6 text-center">
        <h1 class="text-6xl font-black mb-6 uppercase leading-none mt-4">Stay <span class="text-indigo-600">Real.</span></h1>
        
        <div class="neo-card p-6 rounded-2xl inline-block mb-10 w-full max-w-sm">
            <p id="daily-tip-display" class="font-bold italic text-xl text-gray-800">"Ești mai mult decât scorul de la test."</p>
        </div>

        <div class="flex justify-center mb-10">
            <img src="https://api.dicebear.com/7.x/open-peeps/svg?face=smileBig&head=shaved2&skinColor=ffffff&backgroundColor=b6e3f4" 
                 class="w-56 h-56 border-4 border-black rounded-full bg-white shadow-[10px Pint10px_0px_black]">
        </div>
    </main>

    <section id="admin-panel" class="admin-section">
        <div class="max-w-md mx-auto">
            <div id="auth-box">
                <h2 class="text-2xl font-black mb-4 uppercase italic">Acces Admin</h2>
                <input type="password" id="pass" class="w-full border-4 border-black p-4 rounded-xl font-black mb-4 mb-6" placeholder="Introdu Parola">
                <button onclick="checkPass()" class="w-full bg-black text-white py-4 rounded-xl font-black border-2 border-black mb-4">DEBLOCHEAZĂ</button>
                <button onclick="toggleAdmin()" class="w-full text-xs font-bold underline uppercase">Înapoi la site</button>
            </div>

            <div id="dashboard" class="hidden space-y-8 pb-20">
                <h2 class="text-3xl font-black mb-4 uppercase text-indigo-600 italic">Dashboard</h2>
                
                <div class="space-y-2">
                    <label class="block font-black uppercase text-sm italic">Schimbă Mesajul Zilei:</label>
                    <textarea id="new-tip" class="w-full border-4 border-black p-4 rounded-xl font-bold bg-yellow-50" rows="5"></textarea>
                </div>

                <button onclick="saveTip()" class="w-full bg-indigo-500 text-white py-5 rounded-xl font-black border-4 border-black shadow-[6px_6px_0px_black]">SALVEAZĂ MESAJUL</button>
                
                <div class="p-4 border-4 border-black bg-gray-100 rounded-xl">
                    <p class="font-black text-xs uppercase text-gray-500 mb-2">Info:</p>
                    <p class="font-bold">Acest meniu folosește acum scroll-ul normal al telefonului tău. Nu mai este o fereastră blocată.</p>
                </div>

                <button onclick="logout()" class="w-full text-red-600 font-black underline uppercase py-4">Ieșire Admin</button>
            </div>
        </div>
    </section>

    <script>
        function toggleAdmin() {
            const main = document.getElementById('main-content');
            const admin = document.getElementById('admin-panel');
            
            if (admin.style.display === 'block') {
                admin.style.display = 'none';
                main.style.display = 'block';
                window.scrollTo(0, 0);
            } else {
                admin.style.display = 'block';
                main.style.display = 'none';
                window.scrollTo(0, 0);
            }
        }

        function checkPass() {
            if(document.getElementById('pass').value === 'mindvibe2024') {
                document.getElementById('auth-box').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('new-tip').value = document.getElementById('daily-tip-display').innerText;
            } else {
                alert("Parolă incorectă!");
            }
        }

        function saveTip() {
            const text = document.getElementById('new-tip').value;
            if(text) {
                document.getElementById('daily-tip-display').innerText = text;
                alert("Mesaj actualizat cu succes! ✨");
                toggleAdmin();
            }
        }

        function logout() {
            document.getElementById('pass').value = '';
            document.getElementById('auth-box').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            toggleAdmin();
        }
    </script>
</body>
</html>
