<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindVibe - Hub-ul tău de Psihologie</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MindVibe">
    <link rel="apple-touch-icon" href="https://api.dicebear.com/7.x/avataaars/svg?seed=MindVibe">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #fefce8; }
        .neo-card { border: 3px solid #1a1a1a; box-shadow: 8px 8px 0px #1a1a1a; }
        .btn-neo { border: 3px solid #1a1a1a; box-shadow: 4px 4px 0px #1a1a1a; cursor: pointer; transition: 0.1s; }
        .btn-neo:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #1a1a1a; }
        .hero-pattern { background-image: radial-gradient(#6366f1 2px, transparent 2px); background-size: 30px 30px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; }
        .gradient-text { background: linear-gradient(90deg, #6366f1, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>

    <nav class="bg-white border-b-4 border-black sticky top-0 z-50 py-4">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <span class="text-xl font-extrabold uppercase">MindVibe</span>
            <button onclick="openAdmin()" class="bg-yellow-300 border-2 border-black px-3 py-1 font-black text-xs shadow-[2px_2px_0px_black]">MODERARE 🔒</button>
        </div>
    </nav>

    <section class="hero-pattern border-b-4 border-black py-16 px-6">
        <div class="container mx-auto text-center md:text-left flex flex-col md:flex-row items-center">
            <div class="md:w-2/3">
                <h1 class="text-6xl md:text-8xl font-black leading-none mb-6">Stay <span class="gradient-text">Real.</span></h1>
                <div class="bg-white p-6 rounded-2xl border-4 border-black shadow-[6px_6px_0px_black] inline-block mb-8">
                    <p class="text-xs font-black uppercase text-indigo-600 mb-2">Sfatul Moderatorului:</p>
                    <p id="daily-tip-display" class="text-xl font-bold italic">"Ești mai mult decât scorul de la test."</p>
                </div>
            </div>
            <div class="md:w-1/3">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=MindVibe" class="w-64 mx-auto border-4 border-black rounded-full bg-white">
            </div>
        </div>
    </section>

    <section class="py-12 bg-white border-b-4 border-black">
        <div class="container mx-auto px-6 text-center">
            <h2 class="font-black uppercase mb-8">Vibe-ul Lumii Azi</h2>
            <div class="flex justify-center gap-4 mb-8">
                <button onclick="vote('🔥')" class="btn-neo bg-white p-4 text-2xl rounded-xl">🔥</button>
                <button onclick="vote('😌')" class="btn-neo bg-white p-4 text-2xl rounded-xl">😌</button>
                <button onclick="vote('⚡')" class="btn-neo bg-white p-4 text-2xl rounded-xl">⚡</button>
            </div>
            <div id="stats" class="max-w-md mx-auto text-left space-y-4">
                <p class="text-center text-gray-400 italic">Se încarcă datele live...</p>
            </div>
        </div>
    </section>

    <div id="admin-modal" class="modal">
        <div class="bg-white p-8 rounded-3xl border-4 border-black max-w-sm w-full mx-4">
            <div id="auth-section">
                <h3 class="text-xl font-black mb-4 uppercase">Acces Admin</h3>
                <input type="password" id="pass" class="w-full border-4 border-black p-3 mb-4 font-bold" placeholder="Parola">
                <button onclick="checkPass()" class="w-full btn-neo bg-black text-white py-3 font-black">LOG IN</button>
            </div>
            <div id="control-section" class="hidden">
                <h3 class="text-xl font-black mb-4 uppercase">Dashboard</h3>
                <textarea id="new-tip" class="w-full border-4 border-black p-3 mb-4 font-bold" rows="3"></textarea>
                <button onclick="saveTip()" class="w-full btn-neo bg-indigo-500 text-white py-3 font-black">PUBLICĂ</button>
            </div>
            <button onclick="closeAdmin()" class="mt-4 text-xs font-bold underline w-full">ÎNCHIDE</button>
        </div>
    </div>

    <script type="module">
        // Aici va trebui să adaugi config-ul tău Firebase dacă vrei să meargă salvarea reală în cloud
        // Momentan funcționează local pentru testare
        window.vote = (emoji) => {
            alert("Vibe înregistrat: " + emoji + ". În versiunea cu Firebase, acest lucru se actualizează global!");
        };

        window.checkPass = () => {
            if(document.getElementById('pass').value === 'mindvibe2024') {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('control-section').classList.remove('hidden');
            } else {
                alert("Parolă greșită!");
            }
        };

        window.saveTip = () => {
            const tip = document.getElementById('new-tip').value;
            document.getElementById('daily-tip-display').innerText = tip;
            alert("Sfat actualizat!");
            closeAdmin();
        };

        window.openAdmin = () => document.getElementById('admin-modal').style.display = 'flex';
        window.closeAdmin = () => document.getElementById('admin-modal').style.display = 'none';
    </script>

</body>
</html>
