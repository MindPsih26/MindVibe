<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindPsih26 | Squad Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@400;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: white; margin: 0; overflow-x: hidden; }
        .emoji-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; font-size: 3.5rem; opacity: 0.25; pointer-events: none; }
        .fredoka { font-family: 'Fredoka', sans-serif; }
        .section-content { display: none; }
        .section-active { display: block; animation: zoomIn 0.3s ease; }
        .auth-container { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(20px); border: 2px solid rgba(255,255,255,0.1); }
        input, select { background: #334155 !important; border: 1px solid #475569 !important; color: white !important; border-radius: 12px !important; padding: 12px !important; }
        .home-circle { width: 150px; height: 150px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: 0.3s; cursor: pointer; border: 4px solid rgba(255,255,255,0.1); }
        .home-circle:hover { transform: scale(1.1); border-color: white; }
        .main-menu-trigger { position: fixed; top: 20px; right: 20px; z-index: 100; background: #6366f1; width: 60px; height: 60px; border-radius: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #menu-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); z-index: 200; flex-direction: column; align-items: center; justify-content: center; }
        .menu-item { font-size: 2rem; font-weight: 700; margin: 15px 0; cursor: pointer; }
        .chat-bubble { border-radius: 20px; padding: 10px 16px; margin: 4px 0; max-width: 80%; }
        .mine { background: #6366f1; align-self: flex-end; }
        .theirs { background: #334155; align-self: flex-start; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .share-card { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); padding: 20px; border-radius: 25px; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="emoji-bg"><span>😎</span><span>⚡</span><span>🌈</span><span>🚀</span><span>🎨</span><span>💎</span><span>🍀</span><span>🍕</span></div>

    <!-- 🔐 AUTH SECTION -->
    <section id="auth-section" class="section-content section-active min-h-screen flex items-center justify-center p-6">
        <div class="auth-container w-full max-w-md p-8 rounded-[40px]">
            <h2 id="auth-title" class="fredoka text-4xl font-bold text-center text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-indigo-400">MindPsih26</h2>
            <div id="invite-alert" class="hidden bg-green-500/20 text-green-400 text-sm p-3 rounded-xl mt-4 text-center border border-green-500/30">✨ Ai fost invitat în Squad!</div>
            <form id="auth-form" class="flex flex-col gap-4 mt-6">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Parolă" required>
                <div id="extra-fields" class="flex flex-col gap-4">
                    <input type="number" id="age" placeholder="Vârsta ta" min="10" max="25">
                    <select id="gender"><option value="">Sexul</option><option value="M">Masculin</option><option value="F">Feminin</option></select>
                </div>
                <button type="submit" id="auth-submit-btn" class="bg-indigo-600 py-4 rounded-xl font-bold">Creează Profil</button>
            </form>
            <button onclick="switchAuthMode()" class="w-full mt-4 text-indigo-400 text-sm" id="auth-switch-btn">Ai deja cont?</button>
        </div>
    </section>

    <!-- 📱 MAIN APP -->
    <div id="main-app" style="display: none;">
        <div class="main-menu-trigger" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        <div id="menu-overlay" onclick="toggleMenu()">
            <div class="menu-item" onclick="navigateTo('home')">Acasă</div>
            <div class="menu-item" onclick="navigateTo('teen-problems')">Top 10 Probleme</div>
            <div class="menu-item" onclick="navigateTo('chat-section')">Chat Squad</div>
            <div class="menu-item" onclick="navigateTo('tests-hub')">Arena Testelor</div>
            <div class="menu-item text-red-400" onclick="logout()">Logout</div>
        </div>

        <section id="home" class="section-content section-active min-h-screen flex flex-col items-center justify-center p-6 text-center">
            <h1 class="fredoka text-6xl font-bold text-indigo-400">MindPsih26</h1>
            
            <div class="share-card w-full max-w-sm">
                <p class="text-[10px] font-bold uppercase mb-2">Trimite prietenilor (Join direct):</p>
                <div class="flex bg-black/30 rounded-lg p-2 gap-2">
                    <input id="share-link-input" readonly type="text" class="bg-transparent text-[10px] w-full" value="https://site-ul-tau.ro/#join">
                    <button onclick="copyInvite()" class="bg-white text-indigo-600 px-3 py-1 rounded text-[10px] font-bold">COPY</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-6 mt-12">
                <div onclick="navigateTo('teen-problems')" class="home-circle bg-red-500"><i class="fas fa-exclamation-triangle"></i><span>Probleme</span></div>
                <div onclick="navigateTo('tests-hub')" class="home-circle bg-indigo-600"><i class="fas fa-gamepad"></i><span>Teste</span></div>
            </div>
        </section>

        <!-- PROBLEME ADOLESCENTI -->
        <section id="teen-problems" class="section-content max-w-4xl mx-auto py-10 p-6">
            <h2 class="text-3xl font-bold fredoka text-center mb-10 text-red-400">Top 10 Probleme</h2>
            <div id="problems-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>

        <!-- TESTE HUB -->
        <section id="tests-hub" class="section-content max-w-4xl mx-auto py-10 p-6">
            <h2 class="text-3xl font-bold fredoka text-center mb-10 text-indigo-400">Arena Testelor</h2>
            <div id="test-list" class="grid grid-cols-1 gap-4"></div>
        </section>
        
        <!-- RESTUL UI: Chat, Test Runner, etc. (Păstrate din varianta inițială) -->
    </div>

    <script>
        // INIT & INVITE
        window.onload = function() {
            if (window.location.hash === "#join") {
                document.getElementById('invite-alert').classList.remove('hidden');
                isLoginMode = false; switchAuthMode();
            }
            renderProblems();
            const session = JSON.parse(localStorage.getItem('active_session'));
            if (session) loginSuccess(session.userData);
        };

        function copyInvite() {
            const input = document.getElementById('share-link-input');
            input.select(); document.execCommand("copy"); alert("Link copiat!");
        }

        // PROBLEME DATA
        const topProblems = [
            { t: "Imaginea Corpului 🪞", s: ["Nu te compara cu filtrele.", "Sport pt energie.", "Acceptă-te."] },
            { t: "Presiunea Grupului 👯", s: ["Spune Nu.", "Alege prieteni reali.", "Fii tu."] },
            { t: "Performanța Școlară 📚", s: ["Notele nu te definesc.", "Metoda Pomodoro.", "Cere ajutor."] },
            { t: "Relația cu Părinții 👨‍👩‍👦", s: ["Comunică calm.", "Arată responsabilitate.", "Ascultă-i."] },
            { t: "Anxietate Socială 😟", s: ["Pași mici.", "Nu te judecă nimeni.", "Exersează."] },
            { t: "Dependența de Ecrane 📱", s: ["Fără notificări.", "Hobby offline.", "Detox."] },
            { t: "Stima de Sine 📉", s: ["Listă de reușite.", "Fără voce critică.", "Ajută pe alții."] },
            { t: "Bulling 🛑", s: ["Raportează.", "Nu e vina ta.", "Blochează agresorul."] },
            { t: "Prima Dragoste 💔", s: ["E ok să doară.", "Timpul vindecă.", "Nu te izola."] },
            { t: "Viitorul 🚀", s: ["E ok să nu știi încă.", "Explorează.", "Urmează-ți pasiunea."] }
        ];

        function renderProblems() {
            document.getElementById('problems-grid').innerHTML = topProblems.map(p => `
                <div class="bg-slate-800 p-6 rounded-[30px] border-l-4 border-red-500">
                    <h3 class="font-bold mb-3 text-white">${p.t}</h3>
                    <ul class="text-xs space-y-1 text-slate-400">${p.s.map(s => `<li>• ${s}</li>`).join('')}</ul>
                </div>`).join('');
        }

        // NAVIGARE & AUTH (Păstrate)
        let isLoginMode = false;
        function switchAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "Logare" : "MindPsih26";
            document.getElementById('extra-fields').style.display = isLoginMode ? "none" : "flex";
        }
        function loginSuccess(ud) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        }
        function logout() { localStorage.removeItem('active_session'); location.reload(); }
        function navigateTo(id) {
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('section-active'));
            document.getElementById(id).classList.add('section-active');
            document.getElementById('menu-overlay').style.display = 'none';
        }
        function toggleMenu() {
            const m = document.getElementById('menu-overlay');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }
    </script>
</body>
</html>
