<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>MindPsih26 | Squad Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .section-content { display: none; }
        .section-active { display: block; }
        body { background: #0f172a; color: white; font-family: sans-serif; }
    </style>
</head>
<body>
    <!-- AUTH -->
    <section id="auth-section" class="section-content section-active p-10">
        <form id="auth-form" class="max-w-sm mx-auto bg-slate-800 p-8 rounded-2xl">
            <h2 class="text-2xl font-bold mb-4">Login MindPsih26</h2>
            <input type="text" id="user" placeholder="Username" class="w-full mb-4 p-2 text-black">
            <label><input type="checkbox" id="keep"> 30 zile</label>
            <button type="submit" class="w-full bg-indigo-600 mt-4 p-2">Intră</button>
        </form>
    </section>

    <!-- MAIN APP -->
    <div id="main-app" style="display: none;" class="p-6">
        <nav class="flex gap-4 mb-6">
            <button onclick="navigateTo('home')">Home</button>
            <button onclick="navigateTo('chat-section')">Chat Squad</button>
            <button onclick="navigateTo('tests-hub')">Teste</button>
            <button onclick="navigateTo('anti-addiction')">Adicții</button>
        </nav>

        <section id="home" class="section-content section-active">
            <h1 class="text-3xl font-bold">Bun venit, Squad!</h1>
            <input type="text" id="wa-link" readonly class="w-full mt-4 p-2 text-black">
            <button onclick="copyLink()" class="bg-green-600 p-2 mt-2">Copy Link WhatsApp</button>
        </section>

        <!-- CHAT -->
        <section id="chat-section" class="section-content">
            <div class="flex">
                <div class="w-1/4 border-r pr-4">
                    <h3 class="font-bold mb-2">Online</h3>
                    <ul id="users-list"><li>User1 (Online)</li><li>User2 (Online)</li></ul>
                </div>
                <div class="w-3/4 pl-4">
                    <div id="chat-box" class="h-64 overflow-y-auto bg-slate-900 p-4 mb-2"></div>
                    <input type="text" id="msg-in" class="w-full text-black p-2" placeholder="Mesaj...">
                    <button onclick="sendMsg()" class="bg-indigo-600 px-4 mt-2">Trimite</button>
                </div>
            </div>
        </section>

        <!-- TESTE -->
        <section id="tests-hub" class="section-content">
            <button onclick="runTest('stima')" class="block bg-slate-700 p-4 mb-2 w-full">Test Stima de Sine (20 Q)</button>
            <button onclick="runTest('anxietate')" class="block bg-slate-700 p-4 mb-2 w-full">Test Anxietate (15 Q)</button>
        </section>

        <!-- ADICȚII -->
        <section id="anti-addiction" class="section-content">
            <div id="addict-list"></div>
        </section>
    </div>

    <script>
        const ADDICTS = {
            "Telefon": ["Mod Grayscale", "Fără tel la masă", "Time limits", "Aplicații de blocare", "Hobby fizic", "Notificări OFF", "Dormitor fără ecrane"],
            "Jocuri": ["Limita de 1h/zi", "Joacă doar după task-uri", "Șterge jocurile toxice", "Sport în loc", "Socializare offline", "Nu cumpăra skin-uri", "Analizează timpul pierdut"],
            "Zahăr": ["Elimină băuturile dulci", "Fructe în loc de bomboane", "Apă cu lămâie", "Citește etichetele", "Nu cumpăra dulciuri la shop", "Somn mai mult", "Mese regulate"]
            // ... (restul de 10 adicții)
        };

        const QUESTIONS = {
            stima: ["Îmi place cum arăt?", "Mă simt capabil?", "Accept complimente?", "Am încredere în mine?", "Pot refuza favoruri?", "Mă respect?", "Sunt mândru de mine?", "Nu mă compar?", "Am curaj?", "Îmi exprim părerea?", "Sunt valoros?", "Mă iert?", "Sunt asumat?", "Am hobby-uri?", "Sunt optimist?", "Mă îngrijesc?", "Sunt autentic?", "Am limite?", "Sunt empatic cu mine?", "Sunt calm?"],
            anxietate: ["Simți panică?", "Ai inima rapidă?", "Îți faci griji?", "Ai insomnii?", "Ești agitat?", "Respiri greu?", "Eviți oameni?", "Te simți presat?", "Ești mereu atent?", "Transpiri?", "Ești timid?", "Ai ticuri?", "Te temi de eșec?", "Ești tensionat?", "Ești copleșit?"]
        };

        function runTest(key) {
            let score = 0;
            QUESTIONS[key].forEach((q, i) => {
                let ans = prompt(`Q${i+1}: ${q} (1-4)`);
                score += parseInt(ans || 0);
            });
            alert(`Scor: ${score}. Sfaturi: ${key === 'stima' ? "Învață să te iubești" : "Respiră adânc"}`);
        }

        function sendMsg() {
            const msg = document.getElementById('msg-in').value;
            document.getElementById('chat-box').innerHTML += `<div>Tu: ${msg}</div>`;
        }

        function navigateTo(id) {
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('section-active'));
            document.getElementById(id).classList.add('section-active');
        }

        // Persistent Login logic
        document.getElementById('auth-form').onsubmit = (e) => {
            e.preventDefault();
            localStorage.setItem('mind_sess', JSON.stringify({user: document.getElementById('user').value, date: Date.now()}));
            location.reload();
        };

        window.onload = () => {
            document.getElementById('wa-link').value = window.location.href + "#join";
            const sess = JSON.parse(localStorage.getItem('mind_sess'));
            if(sess && (Date.now() - sess.date < 30 * 24 * 60 * 60 * 1000)) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
            }
            
            // Populează Adicții
            let html = "";
            for(let a in ADDICTS) {
                html += `<div class='mb-6'><h3 class='font-bold text-xl'>${a}</h3><ul>${ADDICTS[a].map(h => `<li>- ${h}</li>`).join('')}</ul></div>`;
            }
            document.getElementById('addict-list').innerHTML = html;
        };
        
        function copyLink() { navigator.clipboard.writeText(document.getElementById('wa-link').value); }
    </script>
</body>
</html>
