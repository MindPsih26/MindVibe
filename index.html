<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindVibe - Hub-ul tău de Psihologie</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MindVibe">
    <link rel="apple-touch-icon" href="https://api.dicebear.com/7.x/avataaars/svg?seed=MindVibe">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #fefce8; -webkit-tap-highlight-color: transparent; }
        .neo-card { border: 3px solid #1a1a1a; box-shadow: 8px 8px 0px #1a1a1a; }
        .btn-neo { border: 3px solid #1a1a1a; box-shadow: 4px 4px 0px #1a1a1a; cursor: pointer; transition: 0.1s; display: inline-flex; align-items: center; justify-content: center; }
        .btn-neo:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #1a1a1a; }
        .hero-pattern { background-image: radial-gradient(#6366f1 2px, transparent 2px); background-size: 30px 30px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .gradient-text { background: linear-gradient(90deg, #6366f1, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>

    <nav class="bg-white border-b-4 border-black sticky top-0 z-50 py-4">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <span class="text-xl font-extrabold uppercase tracking-tighter">MindVibe</span>
            <button onclick="openAdmin()" class="bg-yellow-300 border-2 border-black px-3 py-1 font-black text-[10px] shadow-[2px_2px_0px_black] uppercase">Moderare 🔒</button>
        </div>
    </nav>

    <section class="hero-pattern border-b-4 border-black py-12 px-6">
        <div class="container mx-auto text-center md:text-left flex flex-col md:flex-row items-center">
            <div class="md:w-2/3 mb-10 md:mb-0">
                <h1 class="text-5xl md:text-8xl font-black leading-none mb-6">Stay <span class="gradient-text">Real.</span></h1>
                <div class="bg-white p-6 rounded-2xl border-4 border-black shadow-[6px_6px_0px_black] inline-block">
                    <p class="text-[10px] font-black uppercase text-indigo-600 mb-1">Mesajul tău:</p>
                    <p id="daily-tip-display" class="text-xl font-bold italic text-gray-800">"Ești mai mult decât scorul de la test."</p>
                </div>
            </div>
            <div class="md:w-1/3">
                <img src="https://api.dicebear.com/8.x/open-peeps/svg?face=smileBig,smile,cute&head=shaved2,pigtails1,mickey&skinColor=ffffff&backgroundColor=b6e3f4" 
                     class="w-64 mx-auto border-4 border-black rounded-full bg-white shadow-[12px_12px_0px_black] p-2">
            </div>
        </div>
    </section>

    <div id="admin-modal" class="modal">
        <div class="bg-white p-6 rounded-[2rem] border-4 border-black max-w-sm w-full mx-4 shadow-[10px_10px_0px_black] overflow-y-auto max-h-[90vh]">
            
            <div id="auth-section">
                <h3 class="text-2xl font-black mb-4 uppercase italic">Acces Admin 🔒</h3>
                <p class="mb-4 text-xs font-bold text-gray-500 italic">Introdu parola pentru a edita site-ul:</p>
                <input type="password" id="pass" class="w-full border-4 border-black p-4 rounded-xl font-black mb-4 focus:ring-0" placeholder="PAROLA">
                <button onclick="checkPass()" class="w-full btn-neo bg-yellow-400 py-4 rounded-xl font-black uppercase">Deblochează</button>
            </div>

            <div id="control-section" class="hidden space-y-6">
                <div class="flex justify-between items-center border-b-4 border-black pb-2 mb-4">
                    <h3 class="text-xl font-black uppercase italic text-indigo-600">Dashboard 🛠️</h3>
                    <button onclick="closeAdmin()" class="font-black text-2xl">×</button>
                </div>
                
                <div>
                    <label class="block text-[10px] font-black uppercase mb-2">Editează mesajul de pe prima pagină:</label>
                    <textarea id="new-tip" class="w-full border-4 border-black p-3 rounded-xl font-bold bg-yellow-50 text-sm" rows="4"></textarea>
                </div>

                <div class="bg-black text-white p-4 rounded-xl flex justify-between items-center">
