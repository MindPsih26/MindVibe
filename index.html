<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindPsih26 | Squad Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@400;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: white; margin: 0; overflow-x: hidden; }
        .fredoka { font-family: 'Fredoka', sans-serif; }
        .section-content { display: none; }
        .section-active { display: block; }
        .auth-container { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(20px); border: 2px solid rgba(255,255,255,0.1); }
        input, select { background: #334155 !important; border: 1px solid #475569 !important; color: white !important; padding: 12px !important; }
        .home-circle { width: 150px; height: 150px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.3s; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); }
        .chat-bubble { border-radius: 20px; padding: 10px 16px; margin: 4px 0; max-width: 80%; }
        .mine { background: #6366f1; align-self: flex-end; }
        .theirs { background: #334155; align-self: flex-start; }
    </style>
</head>
<body>

    <!-- 🔐 AUTH SECTION -->
    <section id="auth-section" class="section-content section-active min-h-screen flex items-center justify-center p-6">
        <div class="auth-container w-full max-w-md p-8 rounded-[40px] shadow-2xl">
            <h2 id="auth-title" class="fredoka text-4xl font-bold text-center mb-6 text-indigo-400">MindPsih26</h2>
            <form id="auth-form" class="flex flex-col gap-4">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Parolă" required>
                <div id="extra-fields" class="flex flex-col gap-4">
                    <input type="number" id="age" placeholder="Vârsta" min="10" max="25">
                </div>
                <button type="submit" class="bg-indigo-600 py-4 rounded-xl font-bold">Intră în Squad</button>
            </form>
            <p class="text-center mt-4 text-sm opacity-60">Pentru link-ul de distribuire: folosește URL-ul curent adăugând #join</p>
        </div>
    </section>

    <!-- 📱 APP CONTENT -->
    <div id="main-app" style="display: none;">
        <nav class="p-6 flex justify-between items-center">
            <h1 class="fredoka text-2xl font-bold text-indigo-400">MindPsih26</h1>
            <button onclick="logout()" class="text-red-400 text-sm">Logout</button>
        </nav>

        <section id="home" class="section-content section-active p-6">
            <div class="flex flex-wrap gap-4 justify-center">
                <div onclick="navigateTo('teen-problems')" class="home-circle bg-red-500">🆘 Probleme</div>
                <div onclick="navigateTo('tests-hub')" class="home-circle bg-indigo-600">🎮 Teste</div>
                <div onclick="navigateTo('chat-section')" class="home-circle bg-pink-500">💬 Chat</div>
            </div>
            
            <div class="mt-10 bg-slate-800 p-6 rounded-2xl text-center">
                <h3 class="font-bold mb-2">Distribuie pe WhatsApp</h3>
                <input type="text" id="share-link" class="w-full text-center" readonly>
                <button onclick="copyLink()" class="mt-2 bg-green-500 px-6 py-2 rounded-lg text-sm">Copiază Link Invitație</button>
            </div>
        </section>

        <!-- TOP 10 PROBLEME -->
        <section id="teen-problems" class="section-content p-6">
            <h2 class="text-2xl font-bold mb-6">Top 10 Probleme</h2>
            <div id="problems-list" class="grid gap-4"></div>
        </section>

        <!-- CHAT -->
        <section id="chat-section" class="section-content p-6 h-[70vh]">
            <div id="chat-box" class="h-[80%] overflow-y-auto flex flex-col mb-4"></div>
            <div class="flex gap-2">
                <input id="msg-input" class="flex-1 rounded-full px-4" placeholder="Mesajul tău...">
                <button onclick="sendMsg()" class="bg-indigo-600 px-6 rounded-full">Trimite</button>
            </div>
        </section>
    </div>

    <script>
        // Init logic
        window.onload = () => {
            document.getElementById('share-link').value = window.location.origin + window.location.pathname + "#join";
            if(window.location.hash === "#join") alert("Bun venit! Invită-ți și prietenii!");
            
            const session = JSON.parse(localStorage.getItem('user_session'));
            if(session && (Date.now() - session.date < 30 * 24 * 60 * 60 * 1000)) loginApp(session.user);
        };

        function loginApp(user) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            renderProblems();
        }

        document.getElementById('auth-form').onsubmit = (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            localStorage.setItem('user_session', JSON.stringify({user, date: Date.now()}));
            loginApp(user);
        };

        // Anti-Spam
        let lastMsgs = [];
        function sendMsg() {
            const banUntil = localStorage.getItem('ban_until');
            if(banUntil && Date.now() < banUntil) return alert("Ești blocat 3 ore din cauza spam-ului!");

            const now = Date.now();
            lastMsgs = lastMsgs.filter(t => now - t < 2000);
            lastMsgs.push(now);

            if(lastMsgs.length > 4) {
                localStorage.setItem('ban_until', now + (3 * 60 * 60 * 1000));
                alert("SPAM DETECTAT! Blocat 3 ore.");
                return;
            }

            const input = document.getElementById('msg-input');
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div class="chat-bubble mine">${input.value}</div>`;
            input.value = '';
        }

        function renderProblems() {
            const list = document.getElementById('problems-list');
            const probs = ["Imaginea corporală", "Presiunea grupului", "Note școlare", "Relația cu părinții", "Anxietate socială", "Dependența de ecrane", "Stima de sine", "Bullying", "Prima dragoste", "Viitorul"];
            list.innerHTML = probs.map(p => `
                <div class="bg-slate-800 p-4 rounded-xl border-l-4 border-red-500">
                    <h3 class="font-bold">${p}</h3>
                    <p class="text-xs text-slate-400 mt-1">Sfat 1: Comunică deschis • Sfat 2: Nu te compara cu alții • Sfat 3: Cere ajutor specializat.</p>
                </div>
            `).join('');
        }

        function copyLink() {
            navigator.clipboard.writeText(document.getElementById('share-link').value);
            alert("Link copiat! Trimite-l pe WhatsApp.");
        }

        function navigateTo(id) {
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('section-active'));
            document.getElementById(id).classList.add('section-active');
        }

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
