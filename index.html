<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindPsih26 | Squad Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: white; margin: 0; }
        .section-content { display: none; }
        .section-active { display: block; }
        .auth-container { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        input { background: #334155 !important; border: 1px solid #475569 !important; color: white !important; border-radius: 12px; padding: 12px; }
        .home-circle { width: 140px; height: 140px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; border: 2px solid rgba(255,255,255,0.1); font-size: 0.8rem; font-weight: bold; }
        .problem-card { background: #1e293b; padding: 20px; border-radius: 20px; border-left: 5px solid #f97316; margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- AUTH SECTION -->
    <section id="auth-section" class="section-content section-active min-h-screen flex items-center justify-center p-6">
        <div class="auth-container w-full max-w-md p-8 rounded-[40px]">
            <h2 class="text-3xl font-bold text-center mb-6 text-indigo-400">MindPsih26</h2>
            <form id="auth-form" class="flex flex-col gap-4">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Parolă" required>
                <button type="submit" class="bg-indigo-600 py-4 rounded-xl font-bold">Intră în Squad</button>
            </form>
        </div>
    </section>

    <!-- MAIN APP -->
    <div id="main-app" style="display: none;" class="p-6 max-w-2xl mx-auto">
        <nav class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-indigo-400" onclick="navigateTo('home')" style="cursor:pointer">MindPsih26</h1>
            <button onclick="logout()" class="text-red-400 text-sm">Logout</button>
        </nav>

        <section id="home" class="section-content section-active">
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 justify-items-center mb-8">
                <div onclick="navigateTo('tests-hub')" class="home-circle bg-indigo-600">🎮 Teste</div>
                <div onclick="navigateTo('top-15')" class="home-circle bg-orange-500">🚩 Top 15</div>
                <div onclick="navigateTo('anti-addiction')" class="home-circle bg-cyan-600">🛡️ Hacks</div>
                <div onclick="navigateTo('confidence')" class="home-circle bg-emerald-500">🚀 Încredere</div>
            </div>
            <div class="bg-slate-800 p-6 rounded-3xl text-center">
                <h3 class="font-bold mb-2">Distribuie pe WhatsApp</h3>
                <input type="text" id="wa-link" readonly class="w-full text-center text-xs mb-2">
            </div>
        </section>

        <section id="tests-hub" class="section-content">
            <h2 class="text-xl font-bold mb-4">Centrul de Testare</h2>
            <div class="grid gap-3">
                <button onclick="startTest('stima')" class="bg-slate-700 p-4 rounded-xl">💎 Stima de Sine (15 Q)</button>
                <button onclick="startTest('anxietate')" class="bg-slate-700 p-4 rounded-xl">😰 Anxietate (15 Q)</button>
                <button onclick="startTest('emotivitate')" class="bg-slate-700 p-4 rounded-xl">🥺 Emotivitate (15 Q)</button>
                <button onclick="startTest('bullying')" class="bg-slate-700 p-4 rounded-xl">🛡️ Bullying (20 Q)</button>
            </div>
        </section>

        <!-- SECȚIUNI RĂMÂNE INTACTE (Top 15, Hacks, Încredere) -->
        <section id="top-15" class="section-content"><h2 class="text-xl font-bold mb-4">Top 15 Probleme</h2><div id="list-15"></div></section>
        <section id="anti-addiction" class="section-content"><h2 class="text-xl font-bold mb-4">Anti Adicții (15 Sfaturi)</h2><div id="hacks-list"></div></section>
        <section id="confidence" class="section-content"><h2 class="text-xl font-bold mb-4">20 Pași Încredere</h2><div id="conf-list"></div></section>
    </div>

    <script>
        const TEST_CONFIG = {
            stima: { q: 15, title: "Stima de Sine", tips: ["Jurnal de succese", "Fără comparații", "Sport zilnic"] },
            anxietate: { q: 15, title: "Anxietate", tips: ["Respirație 4-4-4", "Somn reglat", "Ceai de plante"] },
            emotivitate: { q: 15, title: "Emotivitate", tips: ["Acceptă-ți lacrimile", "Scrie ce simți", "Discută cu un prieten"] },
            bullying: { q: 20, title: "Bullying", tips: ["Nu riposta agresiv", "Documentează tot", "Cere ajutor adult"] }
        };

        function startTest(key) {
            const config = TEST_CONFIG[key];
            let score = 0;
            for(let i=1; i<=config.q; i++) {
                let ans = prompt(`Întrebarea ${i}/${config.q}: Ești de acord? (1=Deloc, 4=Foarte mult)`);
                score += parseInt(ans || 0);
            }
            const avg = score / config.q;
            let res = avg > 2.5 ? "Nivel Ridicat" : "Nivel Scăzut";
            alert(`Rezultat ${config.title}: ${res}\nSfaturi:\n- ${config.tips.join('\n- ')}`);
        }

        // Inițializare conținut static (Top 15, etc) rămâne la fel...
        window.onload = () => {
            document.getElementById('wa-link').value = window.location.href.split('#')[0] + "#join";
            // ... (populate lists as per previous script)
        };
        
        function logout() { localStorage.clear(); location.reload(); }
        function navigateTo(id) { document.querySelectorAll('.section-content').forEach(s => s.classList.remove('section-active')); document.getElementById(id).classList.add('section-active'); }
    </script>
</body>
</html>
